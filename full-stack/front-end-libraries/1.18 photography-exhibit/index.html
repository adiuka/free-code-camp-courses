<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
		<h1 class="text-4xl font-bold text-blue-800 text-center mt-4">Photography Exhibit</h1>
    <div class="main-container grid grid-cols-1 md:w-2/3 md:mx-auto lg:w-full lg:grid-cols-3 gap-4 mx-3 mt-4 px-4">
			<div class="card border border-gray-600 rounded-lg p-6 flex flex-col">
				<img class="rounded-lg h-48 w-full object-cover mb-4" src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="colosseo">
				<h2 class="subheading font-semibold text-xl">Colosseum, Rome</h2>
				<p class="description text-base font-semibold">Where bloody battles used to take!</p>
			</div>

			<div class="card border border-gray-600 rounded-lg p-6 flex flex-col">
				<img class="rounded-lg h-48 w-full object-cover mb-4" src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="alps">
				<h2 class="subheading font-semibold text-xl">Alps, Austira</h2>
				<p class="description text-base font-semibold">Some of the best god damn hiking!</p>
			</div>

			<div class="card border border-gray-600 rounded-lg p-6 flex flex-col">
				<img class="rounded-lg h-48 w-full object-cover mb-4" src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="sea">
				<h2 class="subheading font-semibold text-xl">Sea, Carribean</h2>
				<p class="description text-base font-semibold">Just look at that turquise Water!</p>
			</div>
		</div>
  </body>
</html>
