<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Danish Flash Cards</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<main class="main-container">
			<header>
				<h1>Learn Danish the easy Way</h1>
			</header>
			<div class="app-container">
				<div id="flashcard">
					<div class="card-face card-front"><p id="card-front-text"></p></div>
					<div class="card-face card-back"><p id="card-back-text"></p></div>
				</div>
			</div>

			<div class="options-container">
				<div class="all-cards">

				</div>

				<button id="delete-btn">Delete Card</button>

				<form id="entry-form">
					<label for="front-text">Front text</label>
					<textarea id="front-text" rows="3"></textarea>

					<label for="back-text">Back text</label>
					<textarea id="back-text" rows="3"></textarea>

					<button type="submit">Add Card</button>
					<p id="error-message" role="alert"></p>
				</form>
			</div>
		</main>
		<script src="index.ts"></script>
	</body>
</html>
