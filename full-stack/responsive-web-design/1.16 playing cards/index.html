<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main id="playing-cards">
    <div class="card red">
      <div class="left">
        <div>8</div>
        <div>♥</div>
      </div>
      <div class="middle">
        <div class="middle-section">
          <div>♥</div>
          <div>♥</div>
        </div>
        <div class="middle-section">
          <div>♥</div>
          <div>♥</div>
        </div>
        <div class="middle-section">
          <div class="reversed">♥</div>
          <div class="reversed">♥</div>
        </div>
        <div class="middle-section">
          <div class="reversed">♥</div>
          <div class="reversed">♥</div>
        </div>
      </div>
      <div class="right">
        <div class="reversed">8</div>
        <div class="reversed">♥</div>
      </div>
    </div>

    <div class="card red">
      <div class="left">
        <div>7</div>
        <div>♦</div>
      </div>
      <div class="middle">
        <div class="middle-section">
          <div>♦</div>
          <div>♦</div>
        </div>
        <div class="middle-section">
          <div>♦</div>
          <div>♦</div>
        </div>
        <div class="middle-section">
          <div>♦</div>
          <div>♦</div>
        </div>
        <div class="middle-section">
          <div>♦</div>
        </div>
      </div>
      <div class="right">
        <div class="reversed">7</div>
        <div class="reversed">♦</div>
      </div>
    </div>
    
    <div class="card">
      <div class="left">
        <div>2</div>
        <div>♠</div>
      </div>
      <div class="middle">
        <div>♠</div>
        <div class="reversed">♠</div>
      </div>
      <div class="right">
        <div class="reversed">2</div>
        <div class="reversed">♠</div>
      </div>
    </div>
  </main>
</body>

</html>
