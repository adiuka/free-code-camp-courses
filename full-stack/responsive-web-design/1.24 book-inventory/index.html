<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Book Inventory</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Book Inventory</h1>
  <table>
    <thead>
      <tr class="columns">
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Status</th>
        <th>Rate</th>
      </tr>
    </thead>

    <tbody>
      <tr class="in-progress">
        <td>The Goldfinch</td>
        <td>Donna Tartt</td>
        <td>Fiction</td>
        <td><span class="status">In Progress</span></td>
        <td><span class="rate">
          <span></span>
          <span></span>
          <span></span>
        </span></td>
      </tr>

      <tr class="to-read">
        <td>goodbye, things</td>
        <td>Fumio Sasaki</td>
        <td>Self-help</td>
        <td><span class="status">To Read</span></td>
        <td><span class="rate">
          <span></span>
          <span></span>
          <span></span>
        </span></td>
      </tr>

      <tr class="read">
        <td>Ikigai</td>
        <td>Hector Garcia</td>
        <td>Self-help</td>
        <td><span class="status">Read</span></td>
        <td><span class="rate three">
          <span></span>
          <span></span>
          <span></span>
        </span></td>
      </tr>

      <tr class="read">
        <td>On the Road</td>
        <td>Jack Kerouac</td>
        <td>Fiction</td>
        <td><span class="status">Read</span></td>
        <td><span class="rate two">
          <span></span>
          <span></span>
          <span></span>
        </span></td>
      </tr>
    </tbody>
  </table>
</body>

</html>
