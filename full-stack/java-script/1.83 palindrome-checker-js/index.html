<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <main class="container">
        <h1 class="title">Is it a Palindrome?</h1>
        <div class="palindrome-container">
            <label for="text-input">Enter text to check palindrome:</label>
            <input class="palindrome-input" id="text-input" value type="text">
            <button class="palindrome-btn" id="check-btn">Check</button>
            <div class="results-container" id="result" hidden>

            </div>
        </div>
        <div class="palindrome-info-container">
            <p class="palindrome-info">
                A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.
            </p>
        </div>
    </main>
</body>
<script src="./script.js"></script>
</html>
